[project]
name = "iceberg-reliability-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "pyiceberg[pyarrow,s3fs]==0.11.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "rich>=14.3.4",
    "typer>=0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
