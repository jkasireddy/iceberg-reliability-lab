services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: iceberg-lab-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio


  postgres:
    image: postgres:17-alpine
    container_name: iceberg-lab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_USER: ${POSTGRES_USER:-lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab} -d ${POSTGRES_DB:-orders}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - iceberg_net

  mc:
    image: minio/mc
    container_name: iceberg-lab-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password)
      do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      echo 'Warehouse bucket ready';
      "
    networks:
      - iceberg_net

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    container_name: iceberg-lab-rest
    depends_on:
      - minio
      - mc
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1

      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_JDBC_STRICT__MODE: "true"

    ports:
      - "8181:8181"

    networks:
      - iceberg_net

volumes:
  minio_data:
  postgres_data:

networks:
  iceberg_net:
    driver: bridge

